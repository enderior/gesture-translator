<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Gesture Translator</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 20px;
                max-width: 600px;
                margin: 0 auto;
            }
            h1 {
                font-size: 20px;
            }
            .upload-box {
                border: 2px dashed #ccc;
                padding: 20px;
                text-align: center;
                border-radius: 8px;
                margin-bottom: 20px;
            }
            button {
                padding: 10px 20px;
                background: #0077ff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }
            button:disabled {
                background: #ccc;
            }
            #status {
                font-size: 14px;
                margin-top: 15px;
                font-weight: bold;
                color: #333;
            }
            #result {
                margin-top: 20px;
                padding: 15px;
                background: #f0f0f0;
                border-radius: 4px;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <h1>Модуль перевода жестов</h1>

        <div class="upload-box">
            <input type="file" id="videoFile" accept="video/*,image/*" />
        </div>

        <button id="uploadBtn">Отправить на обработку</button>
        <div id="status"></div>
        <div id="result"></div>

        <script src="popup.js"></script>
    </body>
</html>
